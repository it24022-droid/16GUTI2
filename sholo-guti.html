<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sholo Guti</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9F%A4%3C/text%3E%3C/svg%3E">
<style>
:root{--bg1:#c29560;--bg2:#96693e;--card:#d6aa76;--ink:#46280f;--btn:#8a5a2b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#5a4028;--bg2:#3a2915;--card:#9a7448;--ink:#fff1dc;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#5a4028;--bg2:#3a2915;--card:#9a7448;--ink:#fff1dc;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:linear-gradient(var(--bg1),var(--bg2));font-family:Georgia,serif;color:var(--ink)}
*{box-sizing:border-box}
#home{max-width:460px;margin:0 auto;padding:14px;overflow:auto;height:100%}
.card{background:var(--card);border:4px solid #84582e;border-radius:26px;padding:18px}
h1{text-align:center;margin:0;font-size:2.1rem;letter-spacing:2px}
.sub{text-align:center;font-style:italic;margin:0 0 10px}
label{display:block;margin:7px 0 2px;font:700 14px sans-serif}
input[type=text],select,input[type=number]{width:100%;padding:8px;border-radius:8px;border:2px solid #84582e;font-size:15px;background:#f6e6cc;color:#46280f}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row input[type=number]{width:62px}
button{font:700 15px sans-serif;border:0;border-radius:10px;padding:10px 14px;background:var(--btn);color:#fff;cursor:pointer}
button:disabled{opacity:.45}
#go{background:#58882f;width:100%;margin-top:12px;font-size:17px}
#game{height:100%;display:flex;flex-direction:column}
#hud{text-align:center;padding:6px 6px 0;font:700 17px sans-serif}
#sub{font:13px sans-serif;display:block;min-height:17px}
#bar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:6px}
#bar button{padding:8px 11px;font-size:14px}
#cvw{flex:1;position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation}
.ov{position:absolute;inset:0;background:rgba(60,34,14,.9);color:#f5e1be;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;font:700 26px sans-serif;padding:20px}
[hidden]{display:none!important}
</style></head><body>
<div id="home"><div class="card">
<h1>SHOLO GUTI</h1><p class="sub">16 Guti</p>
<label>Mode</label>
<select id="mode"><option value="cpu">Play with Computer</option><option value="two">Two Players (same device)</option></select>
<label id="l1">Your name</label><input type="text" id="n1" value="Player 1" maxlength="14">
<div id="r2"><label>Player 2 name</label><input type="text" id="n2" value="Player 2" maxlength="14"></div>
<label id="ls">Your guti</label>
<select id="side"><option value="1">Green (Shupari)</option><option value="2">Brown (Jhatar Kathi)</option></select>
<div id="rd"><label>Difficulty</label><select id="lv"><option value="0">Easy</option><option value="1" selected>Medium</option><option value="2">Hard</option></select></div>
<label><input type="checkbox" id="tm"> Time limit (whole game)</label>
<div class="row"><input type="number" id="th" min="0" max="23" value="0" disabled>h <input type="number" id="tmin" min="0" max="59" value="10" disabled>m <input type="number" id="ts" min="0" max="59" value="0" disabled>s</div>
<label><input type="checkbox" id="snd" checked> Sound</label>
<label><input type="checkbox" id="hn"> Show hint (suggested move)</label>
<button id="go">START</button>
<button id="how" style="width:100%;margin-top:8px">How to Play</button>
<p style="font:12px sans-serif;margin:10px 0 0">Online play with a friend needs a server, so it is only in the Java version.</p>
</div></div>
<div id="game" hidden>
<div id="hud"><span id="turn"></span><span id="sub"></span><span id="clk"></span></div>
<div id="bar"><button id="bEnd" disabled>End Turn</button><button id="bPause">Pause</button><button id="bHint">Hint: OFF</button><button id="bNew">New Game</button><button id="bExit" style="background:#964632">Exit</button></div>
<div id="cvw"><canvas id="cv"></canvas><div class="ov" id="ovp" hidden>PAUSED<button id="bRes">Resume</button></div><div class="ov" id="ovr" hidden><div id="rmsg"></div><button id="bAgain">Play Again</button><button id="bHome">Home</button></div></div>
</div>
<script>
const $=i=>document.getElementById(i);
// ---------- geometry ----------
const P=[];for(let y=0;y<=8;y+=2)for(let x=0;x<=8;x+=2)P.push([x,y]);
[[3,-1],[4,-1],[5,-1],[2,-2],[4,-2],[6,-2],[3,9],[4,9],[5,9],[2,10],[4,10],[6,10]].forEach(p=>P.push(p));
const N=P.length,E=P.map(()=>Array(N).fill(0));
const id=(x,y)=>P.findIndex(p=>p[0]==x&&p[1]==y),L=(a,b)=>{E[a][b]=E[b][a]=1};
for(let i=0;i<25;i++)for(let j=i+1;j<25;j++){const dx=Math.abs(P[i][0]-P[j][0]),dy=Math.abs(P[i][1]-P[j][1]);
 if((dx==2&&!dy)||(!dx&&dy==2)||(dx==2&&dy==2&&(P[i][0]/2+P[i][1]/2)%2==0))L(i,j)}
[[3,-1,4,-1],[4,-1,5,-1],[2,-2,4,-2],[4,-2,6,-2],[4,0,4,-1],[4,-1,4,-2],[4,0,3,-1],[3,-1,2,-2],[4,0,5,-1],[5,-1,6,-2]]
 .forEach(t=>{L(id(t[0],t[1]),id(t[2],t[3]));L(id(t[0],8-t[1]),id(t[2],8-t[3]))});
const ADJ=P.map((_,a)=>P.map((_,b)=>b).filter(b=>E[a][b]));
const JMP=P.map((p,a)=>{const r=[];ADJ[a].forEach(b=>ADJ[b].forEach(c=>{if(c==a)return;
 const x1=P[b][0]-p[0],y1=P[b][1]-p[1],x2=P[c][0]-P[b][0],y2=P[c][1]-P[b][1];
 if(x1*y2-y1*x2==0&&x1*x2+y1*y2>0)r.push([b,c])}));return r});
// ---------- rules ----------
const opt=(c,f,jo)=>{const p=c[f],r=[];if(!jo)for(const b of ADJ[f])if(!c[b])r.push([b,-1]);for(const[j,l]of JMP[f])if(c[j]==3-p&&!c[l])r.push([l,j]);return r};
const cnt=(c,p)=>c.filter(v=>v==p).length;
const canMove=(c,p)=>c.some((v,i)=>v==p&&opt(c,i,0).length);
const overOf=(a,b)=>{const j=JMP[a].find(j=>j[1]==b);return j?j[0]:-1};
const step=(c,a,b)=>{const o=E[a][b]?-1:overOf(a,b);c[b]=c[a];c[a]=0;if(o>=0)c[o]=0;return o};
function chain(c,p,pos,path,out){let any=0;for(const[j,l]of JMP[pos])if(c[j]==3-p&&!c[l]){any=1;const sv=c[j];c[pos]=0;c[j]=0;c[l]=p;chain(c,p,l,path.concat(l),out);c[l]=0;c[j]=sv;c[pos]=p}
 if(!any&&path.length>1)out.push(path)}
function turns(c,p){const out=[];c.forEach((v,f)=>{if(v!=p)return;ADJ[f].forEach(b=>{if(!c[b])out.push([f,b])});chain(c,p,f,[f],out)});return out}
const applyT=(c,t)=>{for(let i=1;i<t.length;i++)step(c,t[i-1],t[i])};
function search(c,p,d,al,be){const ts=turns(c,p);if(!ts.length)return -1e4-d;if(!d)return(cnt(c,p)-cnt(c,3-p))*100;
 let b=-1e9;for(const t of ts){const n=c.slice();applyT(n,t);const s=-search(n,3-p,d-1,-be,-al);if(s>b)b=s;if(b>al)al=b;if(al>=be)break}return b}
function aiChoose(c,p,lv){const ts=turns(c,p);if(!ts.length)return null;if(!lv)return ts[Math.random()*ts.length|0];
 const d=lv==1?2:3;let best=-1e9,bt=ts[0];for(const t of ts){const n=c.slice();applyT(n,t);const s=-search(n,3-p,d-1,-1e5,1e5)*10+Math.random()*8;if(s>best){best=s;bt=t}}return bt}
// ---------- sound ----------
let AC=null;
function tone(seq){if(!G||!G.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;
 for(const[f,ms]of seq){if(f){const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(AC.destination);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+ms/1000);o.start(t);o.stop(t+ms/1000+.02)}t+=ms/1000}}catch(e){}}
const SND={win:[[523,140],[659,140],[784,140],[1047,450]],lose:[[392,260],[349,260],[311,260],[196,650]],draw:[[440,200],[0,60],[440,320]],move:[[900,35]],cap:[[260,90],[180,120]]};
// ---------- game state ----------
let G=null,clk=null;
const cpuTurn=()=>G.mode=="cpu"&&G.turn!=G.me&&!G.over;
function newGame(){G.c=P.map(p=>p[1]<=2?2:p[1]>=6?1:0);G.turn=1;G.lost=[0,0,0];G.sel=-1;G.chain=0;G.tg=[];G.over=0;G.pause=0;G.hp=null;G.gen=(G.gen||0)+1;G.left=G.total;
 $("ovr").hidden=true;$("ovp").hidden=true;$("bPause").textContent="Pause";clearInterval(clk);if(G.total)clk=setInterval(tick,1000);hint();ui();if(cpuTurn())aiGo()}
function hint(){G.hp=null;if(G.hint&&!G.over&&!G.chain&&!G.pause&&!cpuTurn())G.hp=aiChoose(G.c,G.turn,1)}
function tick(){if(G.pause||G.over||!G.total)return;if(--G.left<=0){G.left=0;timeUp()}ui()}
function timeUp(){const g=cnt(G.c,1),b=cnt(G.c,2);G.sel=-1;G.chain=0;G.tg=[];
 if(g==b)finish(0,"Time is up! Both have "+g+" guti.");else{const w=g>b?1:2;finish(w,"Time is up! "+G.names[w]+" has more guti ("+Math.max(g,b)+" vs "+Math.min(g,b)+").")}}
function click(mx,my){if(G.over||G.pause||G.busy||cpuTurn())return;const n=nodeAt(mx,my);if(n<0)return;
 if(G.chain){if(n==G.sel){endTurn();return}const t=G.tg.find(t=>t[0]==n);if(t)doStep(G.sel,t);return}
 if(G.c[n]==G.turn){G.sel=n;G.tg=opt(G.c,n,0);G.hp=null;draw();return}
 if(G.sel>=0){const t=G.tg.find(t=>t[0]==n);if(t){doStep(G.sel,t);return}}
 G.sel=-1;G.tg=[];hint();draw()}
function doStep(f,t){if(t[1]>=0){G.lost[G.c[t[1]]]++;tone(SND.cap)}else tone(SND.move);step(G.c,f,t[0]);G.sel=t[0];
 if(t[1]>=0){G.tg=opt(G.c,G.sel,1);if(G.tg.length){G.chain=1;G.hp=null;ui();return}}endTurn()}
function endTurn(){G.sel=-1;G.chain=0;G.tg=[];const m=G.turn;G.turn=3-G.turn;
 if(!cnt(G.c,G.turn))finish(m,G.names[G.turn]+" has no guti left.");
 else if(!canMove(G.c,G.turn))finish(m,G.names[G.turn]+" is stuck and cannot move.");
 hint();ui();if(!G.over&&cpuTurn())aiGo()}
function finish(w,why){G.over=1;G.win=w;G.hp=null;clearInterval(clk);
 tone(w==0?SND.draw:(G.mode=="cpu"&&w!=G.me)?SND.lose:SND.win);
 $("rmsg").innerHTML=(w?G.names[w]+" wins!":"It’s a draw!")+"<br><span style='font:16px sans-serif'>"+why+"</span>";$("ovr").hidden=false;ui()}
function aiGo(){G.busy=1;const g=G.gen;const run=()=>{if(g!=G.gen||G.over)return;if(G.pause)return setTimeout(run,250);
 const t=aiChoose(G.c,G.turn,G.lv);if(!t){G.busy=0;return}G.sel=t[0];let i=1;
 const nx=()=>{if(g!=G.gen||G.over)return;if(G.pause)return setTimeout(nx,250);
  if(i>=t.length){G.busy=0;endTurn();return}
  const a=t[i-1],b=t[i],o=E[a][b]?-1:overOf(a,b);if(o>=0){G.lost[G.c[o]]++;tone(SND.cap)}else tone(SND.move);step(G.c,a,b);G.sel=b;i++;draw();setTimeout(nx,520)};
 nx()};setTimeout(run,650)}
function ui(){$("turn").textContent=G.over?(G.win?G.names[G.win]+" wins!":"Draw!"):"Turn: "+G.names[G.turn]+(G.turn==1?" (Green)":" (Brown)");
 $("sub").textContent=G.over?"":G.pause?"Paused":G.busy||cpuTurn()?"Computer is thinking…":G.chain?"Jump again or press End Turn":"Green "+cnt(G.c,1)+" • Brown "+cnt(G.c,2);
 $("clk").textContent=G.total?"Time left: "+[G.left/3600|0,(G.left/60|0)%60,G.left%60].map(v=>String(v).padStart(2,"0")).join(":"):"No time limit";
 $("clk").style.cssText="display:block;font-size:14px;color:"+(G.total&&G.left<=30&&!G.over?"#b02a1a":"inherit");
 $("bEnd").disabled=!G.chain;$("bHint").textContent="Hint: "+(G.hint?"ON":"OFF");draw()}
// ---------- drawing ----------
const cv=$("cv"),X=cv.getContext("2d");let LY={};
function lay(){const W=cv.clientWidth,H=cv.clientHeight,sL=Math.min(W/17.8,H/14.8),sP=Math.min(W/10.6,H/19.2),land=sL>=sP,s=land?sL:sP;
 LY={W,H,s,land,cx:W/2,cy:land?H/2:7.4*s+Math.max(0,(H-19.2*s)/2)}}
function pt(n){let[x,y]=P[n];if(G.flip){x=8-x;y=8-y}return[LY.cx+(x-4)*LY.s,LY.cy+(y-4)*LY.s]}
function nodeAt(mx,my){lay();let b=-1,bd=.7*LY.s;for(let n=0;n<N;n++){const[x,y]=pt(n),d=Math.hypot(x-mx,y-my);if(d<bd){bd=d;b=n}}return b}
function rr(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath()}
function supari(x,y,r,a){X.save();X.translate(x,y);X.rotate(a*Math.PI/180);
 X.fillStyle="rgba(0,0,0,.28)";X.beginPath();X.ellipse(2,3,r*.9,r*1.05,0,0,7);X.fill();
 const egg=()=>{X.beginPath();X.moveTo(0,-1.1*r);X.bezierCurveTo(.55*r,-.9*r,.95*r,-.2*r,.9*r,.2*r);X.bezierCurveTo(.85*r,.7*r,.4*r,r,0,r);X.bezierCurveTo(-.4*r,r,-.85*r,.7*r,-.9*r,.2*r);X.bezierCurveTo(-.95*r,-.2*r,-.55*r,-.9*r,0,-1.1*r);X.closePath()};
 const g=X.createRadialGradient(-.3*r,-.3*r,0,-.3*r,-.3*r,1.6*r);g.addColorStop(0,"#9ccc60");g.addColorStop(.5,"#4e862e");g.addColorStop(1,"#1e4414");
 egg();X.fillStyle=g;X.fill();X.save();egg();X.clip();X.lineWidth=Math.max(1,r*.12);
 for(let i=-3;i<=3;i++){X.beginPath();X.moveTo(0,-1.1*r);X.quadraticCurveTo(i*.55*r,0,i*.28*r,r);X.strokeStyle=i%2?"rgba(195,228,135,.33)":"rgba(20,60,15,.35)";X.stroke()}X.restore();
 egg();X.strokeStyle="#18340e";X.lineWidth=1.2;X.stroke();
 X.fillStyle="rgba(60,40,20,.8)";X.beginPath();X.ellipse(0,.85*r,.28*r,.11*r,0,0,7);X.fill();
 X.fillStyle="rgba(255,255,255,.4)";X.beginPath();X.ellipse(-.3*r,-.45*r,.25*r,.15*r,0,0,7);X.fill();X.restore()}
function kathi(x,y,s,a){const l=.8*s,w=.2*s;X.save();X.translate(x,y);X.rotate(a*Math.PI/180);
 X.fillStyle="rgba(0,0,0,.28)";rr(-l/2+2,-w/2+3,l,w,w*.5);X.fill();
 const g=X.createLinearGradient(0,-w/2,0,w/2);g.addColorStop(0,"#d8ae7a");g.addColorStop(.35,"#a06c3e");g.addColorStop(1,"#5e381a");
 rr(-l/2,-w/2,l,w,w*.5);X.fillStyle=g;X.fill();X.save();X.clip();X.strokeStyle="rgba(70,40,18,.5)";X.lineWidth=1;
 X.beginPath();X.moveTo(-l/2,-w*.15);X.lineTo(l/2,-w*.1);X.moveTo(-l/2,w*.2);X.lineTo(l/2,w*.28);X.stroke();
 X.fillStyle="rgba(60,34,14,.6)";X.beginPath();X.ellipse(l*.2,0,w*.28,w*.2,0,0,7);X.fill();X.restore();
 X.fillStyle="#eed0a0";X.beginPath();X.ellipse(l/2-w*.3,0,w*.2,w*.33,0,0,7);X.ellipse(-l/2+w*.3,0,w*.2,w*.33,0,0,7);X.fill();
 rr(-l/2,-w/2,l,w,w*.5);X.strokeStyle="#422610";X.lineWidth=1.2;X.stroke();X.restore()}
const piece=(c,x,y,s,a,k)=>c==1?supari(x,y,.27*s*k,a):kathi(x,y,s*k,a);
function pit(px,py,R,c,s){let g=X.createRadialGradient(px,py,0,px,py,R);g.addColorStop(0,"#704a28");g.addColorStop(.8,"#8a5e36");g.addColorStop(1,"#aa7c4e");
 X.fillStyle=g;X.beginPath();X.arc(px,py,R,0,7);X.fill();X.strokeStyle="#69441f";X.lineWidth=4;X.stroke();
 const k=R/(1.75*s);for(let i=0;i<Math.min(G.lost[c],16);i++){let x=px,y=py,a=i*61%180;
  if(i>=1&&i<=6){const t=(60*(i-1))*Math.PI/180;x+=.85*s*k*Math.cos(t);y+=.85*s*k*Math.sin(t);a=60*(i-1)+90}
  else if(i>=7){const t=(40*(i-7)+20)*Math.PI/180;x+=1.3*s*k*Math.cos(t);y+=1.3*s*k*Math.sin(t);a=40*(i-7)+110}
  piece(c,x,y,s,a,c==1?k:.85*k)}
 X.fillStyle="#46280f";X.font="bold "+Math.max(11,s*.36)+"px sans-serif";X.textAlign="center";X.fillText(G.names[c]+" lost: "+G.lost[c],px,py+R+Math.max(15,s*.55))}
function draw(){if(!G)return;const d=devicePixelRatio||1;lay();const{W,H,s,cx,cy,land}=LY;
 if(cv.width!=W*d||cv.height!=H*d){cv.width=W*d;cv.height=H*d}X.setTransform(d,0,0,d,0,0);X.clearRect(0,0,W,H);
 const px=cx-5.2*s,py=cy-7.2*s,pw=10.4*s,ph=14.4*s;
 X.fillStyle="rgba(0,0,0,.2)";rr(px+6,py+8,pw,ph,s);X.fill();
 let g=X.createLinearGradient(0,py,0,py+ph);g.addColorStop(0,"#d6aa76");g.addColorStop(1,"#c69864");rr(px,py,pw,ph,s);X.fillStyle=g;X.fill();
 X.save();rr(px,py,pw,ph,s);X.clip();for(let i=0;i<220;i++){const u=(i*7919%1000)/1000,v=(i*104729%997)/997,z=2+i%4;X.fillStyle=i%2?"rgba(245,220,175,.25)":"rgba(110,70,35,.2)";X.fillRect(px+u*pw,py+v*ph,z,z*.7)}X.restore();
 rr(px,py,pw,ph,s);X.strokeStyle="#84582e";X.lineWidth=5;X.stroke();X.lineCap="round";
 for(let a=0;a<N;a++)for(let b=a+1;b<N;b++)if(E[a][b]){const p=pt(a),q=pt(b);
  X.beginPath();X.moveTo(p[0]+1.5,p[1]+1.5);X.lineTo(q[0]+1.5,q[1]+1.5);X.strokeStyle="#e8c896";X.lineWidth=4;X.stroke();
  X.beginPath();X.moveTo(p[0],p[1]);X.lineTo(q[0],q[1]);X.strokeStyle="#56381c";X.lineWidth=2.6;X.stroke()}
 X.fillStyle="#56381c";for(let n=0;n<N;n++){const p=pt(n);X.beginPath();X.arc(p[0],p[1],3.5,0,7);X.fill()}
 if(land){pit(cx-7.2*s,cy,1.75*s,1,s);pit(cx+7.2*s,cy,1.75*s,2,s)}else{const y=cy+9*s;pit(cx-1.95*s,y,1.7*s,1,s);pit(cx+1.95*s,y,1.7*s,2,s)}
 for(const t of G.tg){const p=pt(t[0]);X.beginPath();X.arc(p[0],p[1],.3*s,0,7);X.fillStyle=t[1]>=0?"rgba(230,80,50,.7)":"rgba(255,235,90,.75)";X.fill();X.strokeStyle="#3c1e0a";X.lineWidth=2;X.stroke()}
 for(let n=0;n<N;n++)if(G.c[n]){const p=pt(n);piece(G.c[n],p[0],p[1],s,G.c[n]==1?n*53%360:n*37%180-15,1)}
 if(G.sel>=0&&G.c[G.sel]){const p=pt(G.sel);X.beginPath();X.arc(p[0],p[1],.38*s,0,7);X.strokeStyle="#ffe128";X.lineWidth=3;X.stroke()}
 if(G.hint&&G.hp&&!G.chain&&!G.over&&!G.pause){X.strokeStyle="rgba(25,105,225,.9)";X.lineWidth=3.5;X.setLineDash([9,7]);
  for(let i=1;i<G.hp.length;i++){const p=pt(G.hp[i-1]),q=pt(G.hp[i]);X.beginPath();X.moveTo(...p);X.lineTo(...q);X.stroke();
   const a=Math.atan2(q[1]-p[1],q[0]-p[0]),hx=q[0]-.2*s*Math.cos(a),hy=q[1]-.2*s*Math.sin(a);X.setLineDash([]);X.beginPath();
   X.moveTo(hx-.18*s*Math.cos(a-.5),hy-.18*s*Math.sin(a-.5));X.lineTo(hx,hy);X.lineTo(hx-.18*s*Math.cos(a+.5),hy-.18*s*Math.sin(a+.5));X.stroke();X.setLineDash([9,7])}
  X.setLineDash([]);const a=pt(G.hp[0]),e=pt(G.hp[G.hp.length-1]);X.beginPath();X.arc(a[0],a[1],.42*s,0,7);X.stroke();
  X.beginPath();X.arc(e[0],e[1],.22*s,0,7);X.fillStyle="rgba(25,105,225,.45)";X.fill()}}
// ---------- UI wiring ----------
function sync(){const two=$("mode").value=="two";$("r2").hidden=!two;$("rd").hidden=two;$("l1").textContent=two?"Player 1 name":"Your name";$("ls").textContent=two?"Player 1 guti":"Your guti";
 ["th","tmin","ts"].forEach(i=>$(i).disabled=!$("tm").checked)}
$("mode").onchange=$("tm").onchange=sync;sync();
$("go").onclick=()=>{const two=$("mode").value=="two",pick=+$("side").value,n1=$("n1").value.trim()||(two?"Player 1":"You"),n2=$("n2").value.trim()||"Player 2";
 const tot=$("tm").checked?(+$("th").value||0)*3600+(+$("tmin").value||0)*60+(+$("ts").value||0):0;
 if($("tm").checked&&tot<=0){alert("Set a time greater than 0, or turn off the time limit.");return}
 const names=["",0,0];if(two){names[pick]=n1;names[3-pick]=n2}else{names[pick]=n1;names[3-pick]="Computer"}
 G={mode:two?"two":"cpu",me:two?0:pick,names,lv:+$("lv").value,total:tot,snd:$("snd").checked,hint:$("hn").checked,flip:!two&&pick==2,busy:0};
 $("home").hidden=true;$("game").hidden=false;newGame()};
$("how").onclick=()=>alert("Each player has 16 guti. Green (Shupari) moves first.\n\nMove: slide a guti along a line to a neighbouring empty point.\nCapture: jump over a neighbouring enemy guti, in a straight line, into the empty point behind it. Capturing is not compulsory.\nMulti-jump: after a capture, jump again with the same guti or press End Turn.\n\nWin: the opponent has no guti left or cannot move. With a time limit, the player with more guti wins when time is up.");
cv.addEventListener("pointerdown",e=>{if(!G)return;const r=cv.getBoundingClientRect();click(e.clientX-r.left,e.clientY-r.top)});
$("bEnd").onclick=()=>{if(G.chain)endTurn()};
function setPause(p){if(G.over)return;G.pause=p;$("ovp").hidden=!p;$("bPause").textContent=p?"Resume":"Pause";hint();ui()}
$("bPause").onclick=()=>setPause(!G.pause);$("bRes").onclick=()=>setPause(false);
$("bHint").onclick=()=>{G.hint=!G.hint;hint();ui()};
$("bNew").onclick=newGame;$("bAgain").onclick=newGame;
const home=()=>{G.gen++;clearInterval(clk);G=null;$("game").hidden=true;$("home").hidden=false};
$("bExit").onclick=()=>{if(confirm("Exit to the home page? The current game will end."))home()};$("bHome").onclick=home;
addEventListener("resize",()=>{if(G)draw()});
</script></body></html>
